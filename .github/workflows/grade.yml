name: Grade Exercises

on:
  push:
  pull_request:
  workflow_dispatch: {} # manual "Run workflow" button always grades everything

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      exercises: ${{ steps.detect.outputs.exercises }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          ALL='["ex01","ex02","ex03","ex04","ex05","ex06","ex07","ex08","ex09","ex10","ex11","ex12"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "exercises=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --name-only --pretty=format: HEAD)
          fi

          EXS=$(echo "$CHANGED" \
            | grep -oE '^exercises/ex[0-9]+' \
            | sed 's#exercises/##' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed exercises: $EXS"
          echo "exercises=$EXS" >> "$GITHUB_OUTPUT"

  grade:
    name: ${{ matrix.exercise }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.exercises != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exercise: ${{ fromJson(needs.detect-changes.outputs.exercises) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run tests for ${{ matrix.exercise }}
        run: bash scripts/run_exercise.sh ${{ matrix.exercise }}
